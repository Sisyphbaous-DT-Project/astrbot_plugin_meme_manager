name: meme_manager
desc: 表情包管理器（个人维护 fork，基于 anka v3.20）。支持自动发送表情、带对话上下文和标签说明的 emotion_llm 判断。Dashboard → 插件页面 → meme_manager 可管理图库，支持粘贴/拖拽添加、确认前预览、批量整理和分类说明。管理页沿用面板登录，无需独立端口或密钥。图床同步为可选功能。
help: 管理图库：Dashboard → 插件页面 → meme_manager → 表情包管理。聊天命令：/表情管理 查看图库、添加表情 [类别]、恢复默认表情包 [类别]、同步状态、同步到云端、从云端同步。开启/关闭管理后台命令仅显示迁移提示，不再启动独立服务。
version: v3.21
author: anka
repo: https://github.com/Sisyphbaous-DT-Project/astrbot_plugin_meme_manager
